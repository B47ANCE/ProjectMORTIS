name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/check_public.py
      - run: python scripts/validate.py --unit-only
  integration:
    # Public, immutable first-party inputs. No secrets, game, saves or deployment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: B47ANCE/B47ANCEDKnowledgeAndWisdom
          ref: 6ba66c0d8f246d438f2e2f3c974fee9f77fdb426
          path: .ci-inputs/knowledge
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: B47ANCE/ProjectNightfall
          ref: 5690021f6d6f5b87ba86e8c9964c527de6d168aa
          path: .ci-inputs/nightfall
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Knowledge actual-source integrations and full host suite
        run: python -B scripts/validate.py --knowledge-and-wisdom .ci-inputs/knowledge --dependency-evidence docs/evidence/knowledge-dependency-6ba66c0-git-bytes.json
      - name: Nightfall exact-input host regressions
        run: python -B scripts/check_nightfall_integration.py --knowledge-and-wisdom .ci-inputs/knowledge --nightfall .ci-inputs/nightfall
      - name: Record scoped evidence
        if: always()
        shell: bash
        run: |
          echo 'Offline host checks only; native tests HUMAN / NOT TESTED. G7 and stable G8 BLOCKED.' >> "$GITHUB_STEP_SUMMARY"
          echo "MORTIS checked-out commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Knowledge input: $(git -C .ci-inputs/knowledge rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Nightfall input: $(git -C .ci-inputs/nightfall rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
